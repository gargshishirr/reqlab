# Render Blueprint — https://render.com/docs/blueprint-spec
# Runs ReqLab on Render's free plan. Without a password it is a public demo: the proxy only calls a few
# well-known test APIs (ALLOWED_HOSTS), checks every redirect hop, and is rate limited, so it can't be
# used as an open proxy. With REQLAB_PASSWORD set it is your own private copy instead (see GUIDE.md).
services:
  - type: web
    name: reqlab
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Optional. Leave it empty (or write "off") for the public demo. Set a password (8+ characters)
      # to make your copy private: you sign in first, and it can call any API (ALLOWED_HOSTS is then
      # not used; the SSRF guard below stays on).
      - key: REQLAB_PASSWORD
        sync: false
      # Signs the sign-in cookie, so you stay signed in when the free service sleeps and wakes up.
      - key: SESSION_SECRET
        generateValue: true
      - key: BLOCK_PRIVATE_HOSTS
        value: "true"
      - key: ALLOWED_HOSTS
        value: jsonplaceholder.typicode.com,dummyjson.com,httpbingo.org,postman-echo.com,reqres.in,pokeapi.co,dog.ceo,*.dog.ceo,catfact.ninja,example.com
      - key: MAX_RESPONSE_BYTES
        value: "2097152"
      - key: MAX_BODY_BYTES
        value: "1048576"
      - key: RATE_LIMIT_PER_MINUTE
        value: "20"
      - key: RATE_LIMIT_TOTAL_PER_MINUTE
        value: "120"
      # Render sits behind Cloudflare, which sets this header to the visitor's address.
      - key: CLIENT_IP_HEADER
        value: cf-connecting-ip
