services:
  reqlab:
    build: .
    container_name: reqlab
    ports:
      - "4000:4000"
    # Settings come from a .env file next to this one, if there is one (copy .env.example).
    # If other people can reach this copy, set REQLAB_PASSWORD and SESSION_SECRET there.
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 4000
      HOST: 0.0.0.0
    # The server writes nothing, so the container can be locked down.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
